<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1430" role="img" aria-labelledby="title desc">
  <title id="title">Upear security-augmented architecture</title>
  <desc id="desc">The Upear SafeHarness Suite security layer added by Upear sits above the HugAgentOS platform base and enforces on the message path, the tool path, the memory path, and the audit ledger across all layers.</desc>
  <defs>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .sec-bg { fill: #fdf1f0; stroke: #c40000; stroke-width: 6; }
      .sec-label { fill: #c40000; font-size: 40px; font-weight: 800; }
      .sec-sub { fill: #8f8f8f; font-size: 24px; font-weight: 500; }
      .sec-box { fill: #ffffff; stroke: #c40000; stroke-width: 4; }
      .sec-box-title { fill: #c40000; font-size: 30px; font-weight: 800; }
      .sec-box-sub { fill: #555; font-size: 22px; font-weight: 500; }
      .ext-badge { fill: #c40000; }
      .ext-badge-text { fill: #fff; font-size: 19px; font-weight: 700; }
      .base-bg { fill: #f4f8fc; stroke: #b7d4ed; stroke-width: 4; }
      .base-label { fill: #2559a5; font-size: 32px; font-weight: 700; }
      .base-box { fill: #fff; stroke: #8bb3dc; stroke-width: 3.5; }
      .base-text { fill: #171717; font-size: 27px; font-weight: 600; }
      .base-hint { fill: #8a8a8a; font-size: 22px; font-weight: 600; }
      .flow { stroke: #c40000; stroke-width: 6; fill: none; marker-end: url(#arrow-red); }
      .flow-label { fill: #c40000; font-size: 24px; font-weight: 800; }
      .ledger { fill: #fff9ed; stroke: #dfa12d; stroke-width: 5; }
      .ledger-text { fill: #875600; font-size: 26px; font-weight: 700; }
      .side-bg { fill: #fdf6e8; stroke: #dfa12d; stroke-width: 5; }
      .side-title { fill: #b06e00; font-size: 30px; font-weight: 800; }
      .side-item { fill: #fff; stroke: #e4b33c; stroke-width: 3.5; }
      .side-item-text { fill: #6b4a00; font-size: 26px; font-weight: 600; }
    </style>
    <marker id="arrow-red" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 z" fill="#c40000"/>
    </marker>
  </defs>

  <!-- ============ SafeHarness security layer (added by Upear) ============ -->
  <rect x="30" y="26" width="1880" height="560" class="sec-bg"/>
  <text x="62" y="92" class="sec-label">Upear Guard Security Layer</text>
  <text x="640" y="92" class="sec-sub">added by Upear on top of the platform base — not part of it</text>
  <text x="62" y="134" class="sec-sub">Lifecycle-integrated enforcement: every check below is a first-class hook on the execution path — deny-only, default-off, fail-closed.</text>

  <rect x="62" y="162" width="570" height="112" class="sec-box"/>
  <text x="90" y="208" class="sec-box-title">Input Defense (INFORM)</text>
  <text x="90" y="248" class="sec-box-sub">patterns + semantic judge, ms-level, fail-closed</text>

  <rect x="656" y="162" width="570" height="112" class="sec-box"/>
  <text x="684" y="208" class="sec-box-title">Capability Gate (CONSTRAIN)</text>
  <text x="684" y="248" class="sec-box-sub">signed capability tokens, privilege split</text>

  <rect x="1250" y="162" width="630" height="112" class="sec-box"/>
  <text x="1278" y="208" class="sec-box-title">Tool Gateway + Receipts</text>
  <text x="1278" y="248" class="sec-box-sub">atomic consumption, HMAC countersign</text>

  <rect x="62" y="292" width="570" height="112" class="sec-box"/>
  <text x="90" y="338" class="sec-box-title">Run Supervision + Review</text>
  <text x="90" y="378" class="sec-box-sub">step/loop/budget triggers → recheck → queue</text>

  <rect x="656" y="292" width="570" height="112" class="sec-box"/>
  <text x="684" y="338" class="sec-box-title">Policy Center</text>
  <text x="684" y="378" class="sec-box-sub">hot rules + chains + rollback</text>
  <rect x="1080" y="300" width="130" height="34" class="ext-badge"/>
  <text x="1145" y="324" text-anchor="middle" class="ext-badge-text">added here</text>

  <rect x="1250" y="292" width="630" height="112" class="sec-box"/>
  <text x="1278" y="338" class="sec-box-title">AI-Assisted Rule Drafting</text>
  <text x="1278" y="378" class="sec-box-sub">LLM draft → validate → sample test → human</text>

  <rect x="62" y="422" width="570" height="112" class="sec-box"/>
  <text x="90" y="468" class="sec-box-title">MCP Channel Guard</text>
  <text x="90" y="508" class="sec-box-sub">descriptor scan + policy middleware</text>

  <rect x="656" y="422" width="570" height="112" class="sec-box"/>
  <text x="684" y="468" class="sec-box-title">Trajectory &amp; Tag Chains</text>
  <text x="684" y="508" class="sec-box-sub">cross-tool chains, retry pressure, entropy</text>

  <rect x="1250" y="422" width="630" height="112" class="sec-box"/>
  <text x="1278" y="468" class="sec-box-title">FSM Planning Guard</text>
  <text x="1278" y="508" class="sec-box-sub">per-input semantic checks; LLM proposes, code executes</text>

  <text x="62" y="572" class="flow-label">Enforcement points:</text>
  <text x="300" y="572" class="sec-box-sub">message entry (chat / plan inputs) · tool execution (gateway + MCP guard) · memory write gate · full-stack audit</text>

  <!-- ============ platform base ============ -->
  <rect x="30" y="620" width="1880" height="790" class="base-bg"/>
  <text x="62" y="678" class="base-label">Platform Base</text>
  <text x="290" y="678" class="sec-sub">HugAgentOS foundation, extended in this repository (see Acknowledgements)</text>

  <text x="62" y="732" class="base-hint">Channels</text>
  <rect x="200" y="700" width="520" height="64" class="base-box"/><text x="460" y="742" text-anchor="middle" class="base-text">Web / Desktop clients</text>
  <rect x="740" y="700" width="520" height="64" class="base-box"/><text x="1000" y="742" text-anchor="middle" class="base-text">IM (DingTalk / WeCom / Feishu)</text>
  <rect x="1280" y="700" width="320" height="64" class="base-box"/><text x="1440" y="742" text-anchor="middle" class="base-text">Open API / API Key</text>
  <rect x="1620" y="700" width="270" height="64" class="base-box"/><text x="1755" y="742" text-anchor="middle" class="base-text">Model gateway</text>

  <text x="62" y="822" class="base-hint">Agents</text>
  <rect x="200" y="790" width="400" height="64" class="base-box"/><text x="400" y="832" text-anchor="middle" class="base-text">Multi-agent chat</text>
  <rect x="620" y="790" width="400" height="64" class="base-box"/><text x="820" y="832" text-anchor="middle" class="base-text">FSM plan mode</text>
  <rect x="1040" y="790" width="400" height="64" class="base-box"/><text x="1240" y="832" text-anchor="middle" class="base-text">Batch / automation</text>
  <rect x="1460" y="790" width="220" height="64" class="base-box"/><text x="1570" y="832" text-anchor="middle" class="base-text">Sub-agents</text>
  <rect x="1700" y="790" width="190" height="64" class="base-box"/><text x="1795" y="832" text-anchor="middle" class="base-text">Ext. bridge</text>

  <text x="62" y="912" class="base-hint">Engines</text>
  <rect x="200" y="880" width="400" height="64" class="base-box"/><text x="400" y="922" text-anchor="middle" class="base-text">Skills engine</text>
  <rect x="620" y="880" width="400" height="64" class="base-box"/><text x="820" y="922" text-anchor="middle" class="base-text">Memory engine (mem0)</text>
  <rect x="1040" y="880" width="400" height="64" class="base-box"/><text x="1240" y="922" text-anchor="middle" class="base-text">Orchestration engine</text>
  <rect x="1460" y="880" width="430" height="64" class="base-box"/><text x="1675" y="922" text-anchor="middle" class="base-text">Sandboxed execution</text>

  <text x="62" y="1002" class="base-hint">Knowledge</text>
  <rect x="200" y="970" width="400" height="64" class="base-box"/><text x="400" y="1012" text-anchor="middle" class="base-text">Knowledge-base RAG</text>
  <rect x="620" y="970" width="400" height="64" class="base-box"/><text x="820" y="1012" text-anchor="middle" class="base-text">Ontology contracts</text>
  <rect x="1040" y="970" width="400" height="64" class="base-box"/><text x="1240" y="1012" text-anchor="middle" class="base-text">MCP marketplace</text>
  <rect x="1460" y="970" width="430" height="64" class="base-box"/><text x="1675" y="1012" text-anchor="middle" class="base-text">Data canvas</text>

  <text x="62" y="1092" class="base-hint">Data</text>
  <rect x="200" y="1060" width="330" height="64" class="base-box"/><text x="365" y="1102" text-anchor="middle" class="base-text">PostgreSQL / SQLite</text>
  <rect x="550" y="1060" width="280" height="64" class="base-box"/><text x="690" y="1102" text-anchor="middle" class="base-text">Redis</text>
  <rect x="850" y="1060" width="340" height="64" class="base-box"/><text x="1020" y="1102" text-anchor="middle" class="base-text">Milvus / Neo4j</text>
  <rect x="1210" y="1060" width="300" height="64" class="base-box"/><text x="1360" y="1102" text-anchor="middle" class="base-text">Object storage</text>
  <rect x="1530" y="1060" width="360" height="64" class="base-box"/><text x="1710" y="1102" text-anchor="middle" class="base-text">Audit store (WAL)</text>

  <text x="62" y="1182" class="base-hint">Frontend</text>
  <rect x="200" y="1150" width="980" height="64" class="base-box"/><text x="690" y="1192" text-anchor="middle" class="base-text">React console — security operations / policy center / review workbench</text>
  <rect x="1200" y="1150" width="690" height="64" class="base-box"/><text x="1545" y="1192" text-anchor="middle" class="base-text">SafeHarness Admin UI (38308)</text>

  <text x="62" y="1272" class="base-hint">Deploy</text>
  <text x="200" y="1272" class="base-text">One-command installer · Docker Compose · Nginx · AgentScope 2.0 · FastAPI · Python 3.10+</text>

  <text x="62" y="1345" class="flow-label">Four injection points into the base:</text>
  <text x="580" y="1345" class="sec-box-sub">① message entry (chat / plan checks)　② tool execution (gateway + MCP guard)　③ memory write gate　④ full-chain audit</text>

  <!-- ============ right rail ============ -->
  <rect x="1950" y="26" width="420" height="1384" class="side-bg"/>
  <text x="1980" y="86" class="side-title">Security governance</text>
  <text x="1980" y="124" class="sec-sub">spans every layer</text>
  <rect x="1980" y="150" width="360" height="68" class="side-item"/><text x="2160" y="194" text-anchor="middle" class="side-item-text">Audit chain + redaction</text>
  <rect x="1980" y="238" width="360" height="68" class="side-item"/><text x="2160" y="282" text-anchor="middle" class="side-item-text">Policy versioning + rollback</text>
  <rect x="1980" y="326" width="360" height="68" class="side-item"/><text x="2160" y="370" text-anchor="middle" class="side-item-text">Human review queue</text>
  <rect x="1980" y="414" width="360" height="68" class="side-item"/><text x="2160" y="458" text-anchor="middle" class="side-item-text">Communication gateway</text>
  <rect x="1980" y="502" width="360" height="68" class="side-item"/><text x="2160" y="546" text-anchor="middle" class="side-item-text">Permission &amp; delegation</text>
  <rect x="1980" y="590" width="360" height="68" class="side-item"/><text x="2160" y="634" text-anchor="middle" class="side-item-text">Rate limit + delivery lease</text>
  <rect x="1980" y="678" width="360" height="68" class="side-item"/><text x="2160" y="722" text-anchor="middle" class="side-item-text">External gateway mgmt</text>
  <rect x="1980" y="766" width="360" height="68" class="side-item"/><text x="2160" y="810" text-anchor="middle" class="side-item-text">Redaction + throttling</text>

  <rect x="1980" y="880" width="360" height="170" class="ledger"/>
  <text x="2160" y="936" text-anchor="middle" class="ledger-text">Four-line audit loop</text>
  <text x="2160" y="986" text-anchor="middle" class="ledger-text">issue → inspect →</text>
  <text x="2160" y="1022" text-anchor="middle" class="ledger-text">dispatched → succeeded</text>

  <!-- enforcement arrows -->
  <path d="M 460 586 L 460 700" class="flow"/>
  <path d="M 820 534 L 820 790" class="flow"/>
  <path d="M 1390 534 L 1390 880" class="flow"/>
  <text x="1408" y="640" class="flow-label">tool / MCP path</text>
  <text x="478" y="640" class="flow-label">message path</text>
  <text x="838" y="700" class="flow-label">FSM planner guard</text>
  <path d="M 1780 534 L 1780 1060" class="flow"/>
  <text x="1798" y="640" class="flow-label">memory write gate</text>
</svg>
